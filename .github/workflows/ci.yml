name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@summitstreet"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build:pre && npm run build:web
        # Environment variables are stored as GitHub secrets.
        env:
          PRINCIPAL_EMAIL_ADDRESS: ${{ secrets.PRINCIPAL_EMAIL_ADDRESS }}
          INFO_EMAIL_ADDRESS: ${{ secrets.INFO_EMAIL_ADDRESS }}
          INFO_VCARD: ${{ secrets.INFO_VCARD }}
